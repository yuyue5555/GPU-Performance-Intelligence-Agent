apiVersion: v1
kind: Service
metadata:
  name: gpu-perflab-api
  namespace: perflab
  labels:
    app: gpu-perflab
    component: api
spec:
  selector:
    app: gpu-perflab
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-perflab-dashboard
  namespace: perflab
  labels:
    app: gpu-perflab
    component: dashboard
spec:
  selector:
    app: gpu-perflab
    component: dashboard
  ports:
    - name: http
      port: 8501
      targetPort: 8501
  type: ClusterIP
