apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpu-perflab-ingress
  namespace: perflab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: perflab.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gpu-perflab-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpu-perflab-dashboard
                port:
                  number: 8501
