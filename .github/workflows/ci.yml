name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff --quiet

      - name: Run ruff
        run: ruff check .

  # ─── Test ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov --quiet

      - name: ETL smoke test
        run: |
          python -m pipeline.etl
          python -c "
          import sqlite3
          conn = sqlite3.connect('data/benchmarks.db')
          count = conn.execute('SELECT COUNT(*) FROM benchmarks').fetchone()[0]
          print(f'Records in DB: {count}')
          assert count > 0, 'ETL produced no records'
          print('ETL smoke test passed.')
          "

      - name: Run pytest
        run: pytest tests/ -v --cov=. --cov-report=xml
        continue-on-error: true  # no tests yet — won't fail the pipeline

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
        continue-on-error: true

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false          # set to true and add registry secrets to push
          tags: gpu-perflab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
